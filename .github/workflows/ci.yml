# GT6: GitHub runs these checks on every push, on a fresh Linux machine.
name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Copies this repo, at the commit that was pushed, onto the machine.
      - uses: actions/checkout@v4

      # Installs Node 24 and keeps npm's download cache between runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Installs exactly what package-lock.json lists.
      - run: npm ci

      # tsc --noEmit: type errors in src/ fail here.
      - run: npm run typecheck

      # The Supertest file. requireAuth and the test both read JWT_SECRET,
      # and .env is not in the repo, so the value comes from the repo's
      # Actions secrets instead.
      - run: npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
